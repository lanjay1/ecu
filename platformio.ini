; ZtuneECU - firmware ECU motor berbasis ESP32-S3
; M0-M5: config + trigger decoder + fuel/ignition math + ZTP v2 (USB+BLE+WiFi)
;        + scheduler + sensor + hw timer + closed loop O2/EGO
; Test native TANPA hardware: make test

[env:ztune_esp32s3]
platform = espressif32@6.9.0   ; PIN: Arduino core 2.0.x (API hw_timer timerBegin(num,div,up))
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.10   ; transport BLE ZTP (Nordic UART Service)
build_flags =
    -std=gnu++17
    -Wall
monitor_filters = esp32_exception_decoder
